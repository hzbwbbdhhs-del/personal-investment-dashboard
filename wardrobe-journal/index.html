<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="衣橱漫游记，属于你的衣橱与购物顾问。整理衣物，发现搭配，买得更合心意。"
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>衣橱漫游记 · 我的衣橱与购物顾问</title>
    <script type="module" crossorigin src="./assets/index-DaT0cFB_.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/react-BCacOENi.js">
    <link rel="modulepreload" crossorigin href="./assets/supabase-CB7MGzWB.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DJxpk97y.css">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100svh;display:grid;align-content:center;justify-items:center;gap:16px;padding:30px;background:#f8f7f3;color:#3f5c4a;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;box-sizing:border-box">
        <h1 style="font:600 30px 'Songti SC',serif;margin:0">衣橱漫游记</h1>
        <p id="loading-hint" role="status" style="font-size:14px;line-height:1.9;margin:0">正在打开你的衣橱…</p>
        <button id="loading-retry" type="button" hidden style="border:0;border-radius:7px;padding:12px 22px;background:#3f5c4a;color:white;font-size:14px">重新加载</button>
        <noscript>请在浏览器中启用 JavaScript 后打开衣橱。</noscript>
      </div>
    </div>
    <script>
      (() => {
        const hint = document.getElementById('loading-hint');
        const retry = document.getElementById('loading-retry');
        const showRetry = () => {
          if (!hint.isConnected) return;
          hint.textContent = '页面暂时没能加载完整。请检查网络，再试一次。';
          retry.hidden = false;
        };
        retry.addEventListener('click', () => location.reload());
        const onResourceError = (event) => {
          if (event.target instanceof HTMLScriptElement && event.target.type === 'module') showRetry();
        };
        window.addEventListener('error', onResourceError, true);
        setTimeout(() => {
          showRetry();
          window.removeEventListener('error', onResourceError, true);
        }, 12000);
      })();
    </script>
  </body>
</html>
